name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the local dev SDK (`flutter --version`).
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      # analysis_options.yaml promotes unused members and dead code to errors,
      # so `flutter analyze` failing here means a real regression, not style.
      - name: Analyze
        run: flutter analyze

      # Tests tagged `live` ask NetEase for real; they are run on a
      # developer's machine, where a failure can be looked into, and kept
      # from failing a build because a third party was slow.
      - name: Test
        run: flutter test --exclude-tags live

  # analyze+test never compiled a single platform — whole-plugin breakage (a
  # bad SPM/CocoaPods file, a missing resource, a native API gone in a plugin
  # update) only surfaced at release time. Debug builds are cheap and compile
  # the real native trees.
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - platform: macos
            os: macos-latest
            command: flutter build macos --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the local dev SDK (`flutter --version`).
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Compile
        run: ${{ matrix.command }}
