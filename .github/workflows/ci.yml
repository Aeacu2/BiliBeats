name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Keep in sync with the local dev SDK (`flutter --version`).
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      # Not in the repository (too large); with it the tests that read real
      # videos with the model run, instead of being skipped.
      - name: Fetch the song model
        run: tool/fetch_song_model.sh

      # The formatter of the SDK pinned above; the retired model's port in
      # tool/song_model/legacy is kept as it was written.
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      # analysis_options.yaml promotes unused members and dead code to errors,
      # so `flutter analyze` failing here means a real regression, not style.
      - name: Analyze
        run: flutter analyze --no-pub

      # Tests tagged `live` ask NetEase for real; they are run on a
      # developer's machine, where a failure can be looked into, and kept
      # from failing a build because a third party was slow.
      - name: Test
        run: flutter test --no-pub --exclude-tags live

  # Compile and package through the shipping build path on each supported
  # platform. CI builds use development symbols and an Android debug key.
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # AGP's lint crashes on the runner's JDK 17 (NoSuchMethodError in its
      # Javadoc parser); release builds run it. Same floor as the README's.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Keep in sync with the local dev SDK (`flutter --version`).
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Select the Android JDK
        if: matrix.platform == 'android'
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Build obfuscated release
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          ALLOW_UNTAGGED: "1"
          ALLOW_DEBUG_SIGNING: "1"
        run: tool/build_release.sh "$BUILD_PLATFORM"
